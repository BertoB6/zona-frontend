<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZonaXP - Download do Jogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --button-free: #0f9d58;
            --button-paid: #ff9800;
            --accent: #ff004f;
            --like-color: #0f9d58;
            --dislike-color: #ff4444;
            --download-blue: #2563eb;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ==================== HEADER ==================== */
        .header {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            margin: -20px -20px 20px -20px;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff004f, #8000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-bar {
            flex: 1;
            min-width: 0;
            max-width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .theme-toggle,
        .menu-icon {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .menu-icon {
            font-size: 1.5rem;
            order: 1;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: var(--bg-card);
            z-index: 1000;
            transition: 0.3s;
            padding: 60px 20px 20px;
            border-left: 1px solid var(--accent);
            box-shadow: -2px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--accent);
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar li:hover {
            color: var(--accent);
            padding-left: 10px;
        }

        .sidebar a {
            color: var(--text-primary);
            text-decoration: none;
            display: block;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* ==================== CARD PRINCIPAL ==================== */
        .download-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== CARROSSEL DE MÍDIA ==================== */
        .media-carousel {
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .media-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .media-slide {
            min-width: 100%;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .media-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .media-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            transition: 0.3s;
        }

        .media-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .media-btn.prev {
            left: 10px;
        }
        .media-btn.next {
            right: 10px;
        }

        .media-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .media-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: 0.3s;
        }

        .media-dot.active {
            background: var(--accent);
            width: 20px;
            border-radius: 4px;
        }

        .media-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 5;
        }

        /* ==================== INFORMAÇÕES ==================== */
        .info {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .info h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .categoria {
            display: inline-block;
            background: rgba(255,0,79,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent);
            margin-right: 8px;
        }

        .plataforma {
            display: inline-block;
            background: rgba(0,255,156,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #00ff9c;
        }

        .tamanho {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ==================== RATING E PARTILHA ==================== */
        .rating-share {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .rating {
            display: flex;
            gap: 20px;
        }

        .like-btn,
        .dislike-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 30px;
            transition: 0.2s;
        }

        .like-btn.active {
            color: var(--like-color);
            background: rgba(15,157,88,0.1);
        }
        .dislike-btn.active {
            color: var(--dislike-color);
            background: rgba(255,68,68,0.1);
        }

        .share-social {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn,
        .share-icon {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.3s;
            padding: 8px;
            border-radius: 50%;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .share-btn:hover,
        .share-icon:hover {
            background: rgba(255,255,255,0.1);
        }

        .share-icon.whatsapp:hover {
            color: #25D366;
            background: rgba(37,211,102,0.15);
        }

        .share-icon.tiktok:hover {
            color: #000000;
            background: rgba(0,0,0,0.1);
        }

        .share-btn:hover {
            color: var(--accent);
            background: rgba(255,0,79,0.1);
        }

        /* ==================== BOTÕES DE DOWNLOAD ==================== */
        .downloads-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .download-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-align: center;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
        }

        .btn-blue {
            background: var(--download-blue);
        }
        .btn-blue:hover {
            background: #1d4ed8;
        }

        .btn-free {
            background: var(--button-free);
        }
        .btn-free:hover {
            background: #0b7a44;
        }

        .btn-paid {
            background: var(--button-paid);
        }
        .btn-paid:hover {
            background: #e68a00;
        }

        /* ==================== SENHA ==================== */
        .senha-area {
            background: rgba(255,0,79,0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 0 20px 20px 20px;
            text-align: center;
            border: 1px dashed var(--accent);
        }

        .senha {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff9c;
            letter-spacing: 2px;
            background: var(--bg-primary);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 10px;
            font-family: monospace;
        }

        /* ==================== DESCRIÇÃO ==================== */
        .descricao-area {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .descricao-area h4 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .descricao-longa {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ==================== JOGOS RECOMENDADOS ==================== */
        .recomendados {
            padding: 20px;
        }

        .recomendados h4 {
            color: var(--accent);
            margin-bottom: 15px;
        }

        .recomendados-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .recomendados-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .recomendados-scroll::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 10px;
        }
        .recomendados-scroll::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .recom-card {
            flex: 0 0 160px;
            background: var(--bg-primary);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--border-color);
            scroll-snap-align: start;
        }

        .recom-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .recom-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .recom-card .info {
            padding: 10px;
            text-align: left;
            border-bottom: none;
        }

        .recom-card .info h5 {
            font-size: 0.8rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recom-card .info p {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .recom-card .arrow {
            text-align: center;
            padding: 4px;
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* ==================== LOADING E ERRO ==================== */
        .loading,
        .error {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ==================== RESPONSIVIDADE ==================== */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header {
                margin: -12px -12px 20px -12px;
            }
            .logo {
                font-size: 1.1rem;
            }
            .search-bar {
                max-width: 160px;
            }
            .search-bar input {
                padding: 7px 12px;
                font-size: 0.8rem;
            }
            .info h1 {
                font-size: 1.2rem;
            }
            .rating-share {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .rating {
                justify-content: center;
            }
            .share-social {
                justify-content: center;
            }
            .media-slide {
                aspect-ratio: 4 / 3;
            }
            .recom-card {
                flex: 0 0 140px;
            }
            .recom-card img {
                height: 100px;
            }
        }
        
        .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.btn-voltar {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 30px;
    color: var(--text-primary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 4px;
}

.btn-voltar:hover {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.02);
}

.theme-toggle,
.menu-icon {
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.menu-icon {
    font-size: 1.5rem;
    order: 1;
}
    </style>
</head>
<body>

    <div class="container">
        <!-- ========== HEADER ========== -->
        <div class="header">
    <div class="header-content">
        <div class="logo">ZonaXP</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar jogos...">
        </div>
        <div class="header-actions">
            <button class="btn-voltar" onclick="window.location.href='/'">← Voltar</button>
            <button class="theme-toggle" id="themeToggle">🌙</button>
            <button class="menu-icon" id="menuBtn">☰</button>
        </div>
    </div>
</div>

        <!-- ========== SIDEBAR ========== -->
        <div class="sidebar" id="sidebar">
            <div class="close-btn" id="closeMenu">✕</div>
            <ul>
                <li id="menuHome">🏠 Home</li>
                <li id="menuApresentacao">📖 Apresentação</li>
                <li id="menuSuporte">🛡️ Suporte</li>
                <li><a href="compartilhar.html">🎁 Ganhar Jogos</a></li>
            </ul>
        </div>
        <div class="overlay" id="overlay"></div>

        <!-- ========== CARD PRINCIPAL ========== -->
        <div class="download-card" id="downloadCard">
            <div id="content">
                <div class="loading">🔄 Carregando informações do jogo...</div>
            </div>
        </div>

        <footer>
            <p>ZonaXP - Jogos PSP e Mobile</p>
        </footer>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const API_URL = 'https://zona-backend-v3h1.onrender.com';
        const TEMPO_ESPERA_HORAS = 8;
        const TEMPO_ESPERA_MS = TEMPO_ESPERA_HORAS * 60 * 60 * 1000;

        let jogoAtual = null;
        let todosJogos = [];
        let votosUsuario = JSON.parse(localStorage.getItem('votos') || '{}');
        let mediaIndex = 0;

        // Elementos DOM
        const content = document.getElementById('content');
        const searchInput = document.getElementById('searchInput');
        const themeToggle = document.getElementById('themeToggle');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeMenu = document.getElementById('closeMenu');

        // ==================== MODO ESCURO/CLARO ====================
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '🌙';
            }
        }

        themeToggle.addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            if (current === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '🌙';
            }
        });

        // ==================== MENU ====================
        function initMenu() {
            if (menuBtn) {
                menuBtn.addEventListener('click', function() {
                    sidebar.classList.add('active');
                    overlay.classList.add('active');
                });
            }
            if (closeMenu) closeMenu.addEventListener('click', fecharMenu);
            if (overlay) overlay.addEventListener('click', fecharMenu);
            if (document.getElementById('menuHome')) {
                document.getElementById('menuHome').addEventListener('click', function() {
                    fecharMenu();
                    window.location.href = '/';
                });
            }
            if (document.getElementById('menuApresentacao')) {
                document.getElementById('menuApresentacao').addEventListener('click', function() {
                    fecharMenu();
                    alert('📖 Sobre a ZonaXP\n\nPlataforma de distribuição de jogos para PSP, PS2, PC e APK Android.');
                });
            }
            if (document.getElementById('menuSuporte')) {
                document.getElementById('menuSuporte').addEventListener('click', function() {
                    fecharMenu();
                    alert('🛡️ Suporte\n\n📧 Email: suporte@zonaxp.com\n📱 WhatsApp: +258 85 811 2264');
                });
            }
        }

        function fecharMenu() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // ==================== BUSCA ====================
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && searchInput.value.trim()) {
                window.location.href = '/?busca=' + encodeURIComponent(searchInput.value);
            }
        });

        // ==================== VERIFICAÇÃO DE DOWNLOAD ====================
        function verificarUltimoDownload() {
            const ultimoDownload = localStorage.getItem('ultimoDownload');
            if (!ultimoDownload) return true;
            return (Date.now() - parseInt(ultimoDownload)) >= TEMPO_ESPERA_MS;
        }

        function registrarDownload() {
            localStorage.setItem('ultimoDownload', Date.now().toString());
        }

        function mostrarModalEspera() {
            const ultimoDownload = localStorage.getItem('ultimoDownload');
            const horasRestantes = Math.ceil((TEMPO_ESPERA_MS - (Date.now() - parseInt(ultimoDownload))) / (60 * 60 * 1000));
            alert('⏰ Aguarde ' + horasRestantes + 'h para baixar outro jogo.');
        }

        // ==================== LIKES/DISLIKES ====================
        async function votar(tipo, event) {
            if (event) event.stopPropagation();
            if (!jogoAtual) return;

            const votoAtual = votosUsuario[jogoAtual.id];

            if (votoAtual === tipo) {
                delete votosUsuario[jogoAtual.id];
                if (tipo === 'like') jogoAtual.likes--;
                else jogoAtual.dislikes--;
            } else {
                if (votoAtual === 'like') jogoAtual.likes--;
                if (votoAtual === 'dislike') jogoAtual.dislikes--;
                votosUsuario[jogoAtual.id] = tipo;
                if (tipo === 'like') jogoAtual.likes++;
                else jogoAtual.dislikes++;
            }

            localStorage.setItem('votos', JSON.stringify(votosUsuario));

            try {
                await fetch(API_URL + '/api/avaliacao/' + jogoAtual.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ likes: jogoAtual.likes, dislikes: jogoAtual.dislikes })
                });
            } catch (e) { console.error('Erro ao salvar voto:', e); }

            atualizarRating();
        }

        function atualizarRating() {
            const ratingDiv = document.querySelector('.rating');
            if (ratingDiv && jogoAtual) {
                const isLiked = votosUsuario[jogoAtual.id] === 'like';
                const isDisliked = votosUsuario[jogoAtual.id] === 'dislike';

                ratingDiv.innerHTML =
                    '<button class="like-btn ' + (isLiked ? 'active' : '') + '" onclick="votar(\'like\', event)">👍 <span>' + (jogoAtual.likes || 0) + '</span></button>' +
                    '<button class="dislike-btn ' + (isDisliked ? 'active' : '') + '" onclick="votar(\'dislike\', event)">👎 <span>' + (jogoAtual.dislikes || 0) + '</span></button>';
            }
        }

        // ==================== PARTILHAR JOGO ====================
        function partilharJogo() {
            if (!jogoAtual) return;
            const shareUrl = window.location.origin + '/download.html?jogo=' + jogoAtual.id;
            const shareText = jogoAtual.nome +
                '\n📂 Categoria: ' + jogoAtual.categoria +
                '\n🎯 Plataforma: ' + jogoAtual.plataforma +
                '\n📦 Tamanho: ' + (jogoAtual.tamanho || 'Não informado') +
                '\n\n✅ Grátis para download!' +
                '\n\n👇 Clique no link abaixo: ' + shareUrl;

            if (navigator.share) {
                navigator.share({ title: 'ZonaXP - ' + jogoAtual.nome, text: shareText, url: shareUrl });
            } else {
                navigator.clipboard.writeText(shareText).then(function() {
                    alert('📋 Mensagem copiada! Partilhe com amigos.');
                }).catch(function() {
                    prompt('Copie o texto:', shareText);
                });
            }
        }

        // ==================== CARREGAR JOGO ====================
        async function carregarJogo() {
            const urlParams = new URLSearchParams(window.location.search);
            const jogoId = urlParams.get('jogo');

            if (!jogoId) {
                mostrarErro('Nenhum jogo especificado');
                return;
            }

            try {
                const response = await fetch(API_URL + '/api/jogos');
                const data = await response.json();
                todosJogos = data.jogos;
                jogoAtual = todosJogos.find(function(j) { return j.id == jogoId; });

                if (!jogoAtual) {
                    mostrarErro('Jogo não encontrado');
                    return;
                }

                renderizarPagina();
            } catch (error) {
                mostrarErro('Erro ao carregar jogo');
            }
        }

        function getImagemUrl(jogo) {
            if (!jogo.imagem) return 'https://via.placeholder.com/800x300?text=ZonaXP';
            if (jogo.imagem.startsWith('http')) return jogo.imagem;
            return API_URL + '/imagens/' + jogo.imagem + '.jpg';
        }

        // ==================== CARROSSEL DE MÍDIA ====================
        function renderizarCarrosselMedia() {
            const slides = [];

            if (jogoAtual.video_url) {
                slides.push({ type: 'video', url: jogoAtual.video_url });
            }

            if (jogoAtual.imagens_extras && jogoAtual.imagens_extras.length > 0) {
                jogoAtual.imagens_extras.forEach(function(img) {
                    if (img) slides.push({ type: 'image', url: img });
                });
            }

            if (slides.length === 0) {
                slides.push({ type: 'image', url: getImagemUrl(jogoAtual) });
            }

            if (slides.length <= 1) {
                return '<div class="media-slide"><img src="' + slides[0].url + '" alt="' + jogoAtual.nome + '" onerror="this.src=\'https://via.placeholder.com/800x300?text=' + encodeURIComponent(jogoAtual.nome) + '\'"></div>';
            }

            var html = '<div class="media-carousel" id="mediaCarousel">';
            html += '<div class="media-track" id="mediaTrack">';

            slides.forEach(function(slide, index) {
                html += '<div class="media-slide" data-index="' + index + '">';
                if (slide.type === 'video') {
                    html += '<video controls playsinline preload="metadata">';
                    html += '<source src="' + slide.url + '" type="video/mp4">';
                    html += 'Seu navegador não suporta vídeo.';
                    html += '</video>';
                } else {
                    html += '<img src="' + slide.url + '" alt="' + jogoAtual.nome + '" onerror="this.src=\'https://via.placeholder.com/800x300?text=' + encodeURIComponent(jogoAtual.nome) + '\'">';
                }
                html += '</div>';
            });

            html += '</div>';
            html += '<button class="media-btn prev" onclick="mediaSlide(-1)">❮</button>';
            html += '<button class="media-btn next" onclick="mediaSlide(1)">❯</button>';
            html += '<div class="media-dots" id="mediaDots">';
            for (var i = 0; i < slides.length; i++) {
                html += '<div class="media-dot' + (i === 0 ? ' active' : '') + '" onclick="mediaGoTo(' + i + ')"></div>';
            }
            html += '</div>';
            html += '<div class="media-counter">' + (mediaIndex + 1) + ' / ' + slides.length + '</div>';
            html += '</div>';

            return html;
        }

        function mediaSlide(direction) {
            var slides = document.querySelectorAll('.media-slide');
            if (slides.length === 0) return;
            mediaIndex = mediaIndex + direction;
            if (mediaIndex >= slides.length) mediaIndex = 0;
            if (mediaIndex < 0) mediaIndex = slides.length - 1;
            var track = document.getElementById('mediaTrack');
            if (track) track.style.transform = 'translateX(-' + (mediaIndex * 100) + '%)';
            var dots = document.querySelectorAll('.media-dot');
            dots.forEach(function(dot, i) {
                dot.classList.toggle('active', i === mediaIndex);
            });
            var counter = document.querySelector('.media-counter');
            if (counter) counter.textContent = (mediaIndex + 1) + ' / ' + slides.length;
        }

        function mediaGoTo(index) {
            mediaIndex = index;
            var track = document.getElementById('mediaTrack');
            if (track) track.style.transform = 'translateX(-' + (mediaIndex * 100) + '%)';
            var dots = document.querySelectorAll('.media-dot');
            dots.forEach(function(dot, i) {
                dot.classList.toggle('active', i === mediaIndex);
            });
            var counter = document.querySelector('.media-counter');
            if (counter) counter.textContent = (mediaIndex + 1) + ' / ' + slides.length;
        }

        // ==================== RENDERIZAR PÁGINA ====================
        function renderizarPagina() {
    var badgeClass = jogoAtual.pago ? 'badge-paid' : 'badge-free';
    var badgeText = jogoAtual.pago ? '💰 ' + jogoAtual.preco : '🎁 Grátis';
    var isLiked = votosUsuario[jogoAtual.id] === 'like';
    var isDisliked = votosUsuario[jogoAtual.id] === 'dislike';

    // ===== GERAR LINKS DE DOWNLOAD =====
    var links = [];
    if (jogoAtual.download) links.push({ nome: '⬇️ Download', link: jogoAtual.download });
    if (jogoAtual.apk_link) links.push({ nome: '📱 APK', link: jogoAtual.apk_link });
    if (jogoAtual.obb_link) links.push({ nome: '💾 OBB', link: jogoAtual.obb_link });
    if (jogoAtual.data_link) links.push({ nome: '📁 DATA', link: jogoAtual.data_link });
    if (jogoAtual.texture_link) links.push({ nome: '🎨 Texturas', link: jogoAtual.texture_link });
    if (jogoAtual.save_link) links.push({ nome: '💾 Savedata', link: jogoAtual.save_link });
    if (jogoAtual.iso_link) links.push({ nome: '🎮 ISO/ROM', link: jogoAtual.iso_link });

    var botoesDownload = '';

    if (jogoAtual.pago) {
        // Jogo pago: dois botões
        var mensagemWhatsApp = 'Quero%20comprar%20' + encodeURIComponent(jogoAtual.nome);
        botoesDownload = `
            <div class="download-buttons">
                <button class="btn-download btn-paid" onclick="window.location.href='checkout.html?jogo=${jogoAtual.id}'">
                    💳 Pagar Automático
                </button>
                <button class="btn-download btn-blue" onclick="window.open('https://wa.me/258858523520?text=${mensagemWhatsApp}', '_blank')">
                    📱 Pagar Manual (WhatsApp)
                </button>
            </div>
        `;
    } else if (links.length > 0) {
        // Jogo grátis: links normais
        botoesDownload = '<div class="download-buttons">';
        links.forEach(function(link) {
            botoesDownload += '<button class="btn-download btn-blue" onclick="window.open(\'' + link.link + '\', \'_blank\'); registrarDownload();">' + link.nome + '</button>';
        });
        botoesDownload += '</div>';
    } else {
        botoesDownload = '<p style="text-align:center;color:red;">Nenhum link disponível</p>';
    }

    // ===== JOGOS RECOMENDADOS =====
    var recomendados = todosJogos.filter(function(j) {
        return j.id !== jogoAtual.id && j.categoria === jogoAtual.categoria && !j.pago;
    }).slice(0, 10);

    var htmlRecomendados = '';
    if (recomendados.length > 0) {
        htmlRecomendados = '<div class="recomendados"><h4>🎮 Você também pode gostar</h4><div class="recomendados-scroll">';
        recomendados.forEach(function(jogo) {
            var imgUrl = jogo.imagem && jogo.imagem.startsWith('http') ? jogo.imagem : (API_URL + '/imagens/' + jogo.imagem + '.jpg');
            htmlRecomendados += '<div class="recom-card" onclick="window.location.href=\'download.html?jogo=' + jogo.id + '\'">';
            htmlRecomendados += '<img src="' + imgUrl + '" onerror="this.src=\'https://via.placeholder.com/160x120?text=' + encodeURIComponent(jogo.nome) + '\'">';
            htmlRecomendados += '<div class="info"><h5>' + jogo.nome + '</h5><p>' + jogo.categoria + '</p></div>';
            htmlRecomendados += '<div class="arrow">→</div>';
            htmlRecomendados += '</div>';
        });
        htmlRecomendados += '</div></div>';
    }

    // ===== MONTAR PÁGINA =====
    var mediaHtml = renderizarCarrosselMedia();

    content.innerHTML =
        '<div class="imagem-area">' +
        mediaHtml +
        '</div>' +

        '<div class="info">' +
        '<h1>' + jogoAtual.nome + '</h1>' +
        '<div><span class="categoria">' + jogoAtual.categoria + '</span><span class="plataforma">' + (jogoAtual.plataforma === 'APK Android' ? '📱' : '🎮') + ' ' + jogoAtual.plataforma + '</span></div>' +
        '<div class="tamanho">📦 ' + (jogoAtual.tamanho || 'Tamanho não informado') + '</div>' +
        '</div>' +

        '<div class="rating-share">' +
        '<div class="rating">' +
        '<button class="like-btn ' + (isLiked ? 'active' : '') + '" onclick="votar(\'like\', event)">👍 <span>' + (jogoAtual.likes || 0) + '</span></button>' +
        '<button class="dislike-btn ' + (isDisliked ? 'active' : '') + '" onclick="votar(\'dislike\', event)">👎 <span>' + (jogoAtual.dislikes || 0) + '</span></button>' +
        '</div>' +
        '<div class="share-social">' +
        '<button class="share-btn" onclick="partilharJogo()" title="Partilhar"><i class="fas fa-share-alt"></i></button>' +
        '<a href="https://whatsapp.com/channel/0029Vb7YAqi3bbV9tuuiyC1p" target="_blank" class="share-icon whatsapp" title="Canal WhatsApp"><i class="fab fa-whatsapp"></i></a>' +
        '<a href="https://www.tiktok.com/@zonaxp" target="_blank" class="share-icon tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>' +
        '</div>' +
        '</div>' +

        '<div class="downloads-section">' +
        '<div class="download-title">📥 DOWNLOAD</div>' +
        botoesDownload +
        '</div>' +

        (jogoAtual.senha ? '<div class="senha-area"><h4>🔐 Senha</h4><div class="senha">' + jogoAtual.senha + '</div></div>' : '') +

        (jogoAtual.descricao_longa ? '<div class="descricao-area"><h4>📖 Sobre o jogo</h4><div class="descricao-longa">' + jogoAtual.descricao_longa + '</div></div>' : '') +

        htmlRecomendados;

    // Inicializar carrossel de mídia
    mediaIndex = 0;
    var track = document.getElementById('mediaTrack');
    if (track) track.style.transform = 'translateX(0)';

    // Atualizar rating
    atualizarRating();
}

        function mostrarErro(mensagem) {
            content.innerHTML = '<div class="error"><h3>⚠️ Erro</h3><p>' + mensagem + '</p><button class="btn-download btn-blue" onclick="window.location.href=\'/\'">Voltar para Home</button></div>';
        }

        // ==================== EXPOR FUNÇÕES GLOBAIS ====================
        window.votar = votar;
        window.partilharJogo = partilharJogo;
        window.mediaSlide = mediaSlide;
        window.mediaGoTo = mediaGoTo;
        window.registrarDownload = registrarDownload;

        // ==================== INICIALIZAR ====================
        initTheme();
        initMenu();
        carregarJogo();
    </script>

</body>
