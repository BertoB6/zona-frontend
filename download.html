<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZonaXP - Download do Jogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --button-free: #0f9d58;
            --button-paid: #ff9800;
            --accent: #ff004f;
            --download-blue: #2563eb;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            margin: -20px -20px 20px -20px;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff004f, #8000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-bar {
            flex: 1;
            min-width: 0;
            max-width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .theme-toggle, .menu-icon {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .menu-icon { font-size: 1.5rem; order: 1; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* BOTÃO VOLTAR - Aparece no header se estiver logado */
        .btn-voltar-header {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: none; /* Escondido por defeito, JS mostra se logado */
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }

        .btn-voltar-header:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: var(--bg-card);
            z-index: 1000;
            transition: 0.3s;
            padding: 60px 20px 20px;
            border-left: 1px solid var(--accent);
            box-shadow: -2px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar.active { right: 0; }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--accent);
        }

        .sidebar ul { list-style: none; }

        .sidebar li {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar li:hover { color: var(--accent); padding-left: 10px; }

        .sidebar a { color: var(--text-primary); text-decoration: none; display: block; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }

        .overlay.active { display: block; }

        /* CARD PRINCIPAL */
        .download-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* IMAGEM */
        .imagem-area {
            position: relative;
            text-align: center;
            background: var(--bg-primary);
        }

        .imagem-area img { width: 100%; max-height: 300px; object-fit: cover; }

        .price-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .badge-free { background: var(--button-free); color: white; }
        .badge-paid { background: var(--button-paid); color: white; }

        /* INFORMAÇÕES */
        .info {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .info h1 { font-size: 1.6rem; margin-bottom: 8px; }

        .categoria {
            display: inline-block;
            background: rgba(255,0,79,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent);
            margin-right: 8px;
        }

        .plataforma {
            display: inline-block;
            background: rgba(0,255,156,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #00ff9c;
        }

        .tamanho {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* RATING E PARTILHA */
        .rating-share {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .rating {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* VISUALIZAÇÕES */
        .views {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .like-btn,
        .dislike-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 30px;
            transition: 0.2s;
            font-size: 1rem;
        }

        .like-btn .icon,
        .dislike-btn .icon {
            font-size: 1.8rem;
            transition: 0.2s;
            color: var(--text-secondary);
            line-height: 1;
        }

        .like-btn .icon.liked { color: #ff004f; transform: scale(1.15); }
        .dislike-btn .icon.disliked { color: #ff004f; transform: scale(1.15); }

        .like-btn .count,
        .dislike-btn .count { font-size: 0.85rem; font-weight: bold; }

        .share-social { display: flex; align-items: center; gap: 8px; }

        .share-btn, .share-icon {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.3s;
            padding: 8px;
            border-radius: 50%;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .share-btn:hover, .share-icon:hover { background: rgba(255,255,255,0.1); }
        .share-icon.whatsapp:hover { color: #25D366; background: rgba(37,211,102,0.15); }
        .share-icon.tiktok:hover { color: #000000; background: rgba(0,0,0,0.1); }
        .share-btn:hover { color: var(--accent); background: rgba(255,0,79,0.1); }

        /* BOTÕES DE DOWNLOAD */
        .downloads-section { padding: 20px; border-bottom: 1px solid var(--border-color); }

        .download-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-align: center;
        }

        .download-buttons { display: flex; flex-direction: column; gap: 12px; }

        .btn-download {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
        }

        .btn-download:hover { transform: translateY(-2px); }
        .btn-blue { background: var(--download-blue); }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-free { background: var(--button-free); }
        .btn-free:hover { background: #0b7a44; }
        .btn-paid { background: var(--button-paid); }
        .btn-paid:hover { background: #e68a00; }

        /* AVISO DE PARTILHA */
        .aviso-partilha {
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            color: #ffaa00;
            font-size: 0.85rem;
            text-align: center;
        }

        /* SENHA */
        .senha-area {
            background: rgba(255,0,79,0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 0 20px 20px 20px;
            text-align: center;
            border: 1px dashed var(--accent);
        }

        .senha {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff9c;
            letter-spacing: 2px;
            background: var(--bg-primary);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 10px;
            font-family: monospace;
        }

        /* DESCRIÇÃO */
        .descricao-area { padding: 0 20px 20px 20px; border-bottom: 1px solid var(--border-color); }
        .descricao-area h4 { color: var(--accent); margin-bottom: 10px; }
        .descricao-longa { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

        /* RECOMENDADOS */
        .recomendados { padding: 20px; }
        .recomendados h4 { color: var(--accent); margin-bottom: 15px; }

        .recomendados-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .recomendados-scroll::-webkit-scrollbar { height: 6px; }
        .recomendados-scroll::-webkit-scrollbar-track { background: var(--border-color); border-radius: 10px; }
        .recomendados-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .recom-card {
            flex: 0 0 160px;
            background: var(--bg-primary);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--border-color);
            scroll-snap-align: start;
        }

        .recom-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .recom-card img { width: 100%; height: 120px; object-fit: cover; }
        .recom-card .info { padding: 10px; text-align: left; border-bottom: none; }
        .recom-card .info h5 { font-size: 0.8rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recom-card .info p { font-size: 0.65rem; color: var(--text-secondary); }
        .recom-card .arrow { text-align: center; padding: 4px; color: var(--accent); font-size: 1.2rem; }

        /* LOADING E ERRO */
        .loading, .error { text-align: center; padding: 50px; color: var(--text-secondary); }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        footer a { color: var(--accent); text-decoration: none; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff004f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10000;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.ativo { display: block; }

        /* MODAL CONTA */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.97);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-overlay.ativo { display: flex; }

        .modal-content {
            background: #111;
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 420px;
            width: 92%;
            border: 1px solid #ff004f;
            box-shadow: 0 20px 60px rgba(255,0,79,0.3);
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }

        .modal-close:hover { color: #ff004f; }

        .modal-content h2 { color: #ff004f; font-size: 1.4rem; margin-bottom: 15px; }
        .modal-content p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }

        .modal-content .btn-modal {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00ff9c, #00cc7a);
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
        }

        .modal-content .btn-modal:hover { transform: scale(1.02); }

        .modal-content .btn-modal.outline {
            background: transparent;
            border: 2px solid #ff004f;
            color: #ff004f;
        }

        .modal-content .btn-modal.outline:hover { background: #ff004f; color: white; }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { margin: -12px -12px 20px -12px; }
            .logo { font-size: 1.1rem; }
            .search-bar { max-width: 160px; }
            .search-bar input { padding: 7px 12px; font-size: 0.8rem; }
            .info h1 { font-size: 1.2rem; }
            .rating-share { flex-direction: column; align-items: stretch; gap: 8px; }
            .rating { justify-content: center; flex-wrap: wrap; }
            .share-social { justify-content: center; }
            .like-btn .icon, .dislike-btn .icon { font-size: 1.5rem; }
            .recom-card { flex: 0 0 140px; }
            .recom-card img { height: 100px; }
            .btn-voltar-header { padding: 5px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-content">
            <div class="logo">ZonaXP</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar jogos...">
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn-voltar-header" id="btnVoltarHeader">← Voltar</a>
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="menu-icon" id="menuBtn">☰</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="close-btn" id="closeMenu">✕</div>
        <ul>
            <li id="menuHome">🏠 Home</li>
            <li id="menuApresentacao">📖 Apresentação</li>
            <li id="menuSuporte">🛡️ Suporte</li>
            <li><a href="compartilhar.html">🎁 Ganhar Jogos</a></li>
            <li><a href="#" onclick="fazerLogout(); return false;">🚪 Sair</a></li>
        </ul>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="download-card" id="downloadCard">
        <div id="content">
            <div class="loading">🔄 Carregando informações do jogo...</div>
        </div>
    </div>

    <footer>
        <p>ZonaXP - Jogos PSP e Mobile</p>
    </footer>
</div>

<div class="modal-overlay" id="modalConta">
    <div class="modal-content">
        <button class="modal-close" onclick="fecharModalConta()">✕</button>
        <h2>🔐 Precisas de conta</h2>
        <p>Para baixar jogos precisas estar registado.</p>
        <a href="login.html" class="btn-modal">🔐 Entrar</a>
        <a href="registar.html" class="btn-modal outline">📝 Criar Conta</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_URL = 'https://zona-backend-v3h1.onrender.com';

    let jogoAtual = null;
    let todosJogos = [];
    let utilizadorAtual = null;

    const content = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const themeToggle = document.getElementById('themeToggle');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const closeMenu = document.getElementById('closeMenu');
    const modalConta = document.getElementById('modalConta');
    const toast = document.getElementById('toast');
    const btnVoltarHeader = document.getElementById('btnVoltarHeader');

    function verificarSessao() {
        const sessao = localStorage.getItem('sessaoAtiva');
        const utilizadorStr = localStorage.getItem('utilizador');
        if (sessao === 'true' && utilizadorStr) {
            try { return JSON.parse(utilizadorStr); } catch (e) { return null; }
        }
        return null;
    }

    function mostrarToast(mensagem) {
        toast.textContent = mensagem;
        toast.classList.add('ativo');
        setTimeout(() => toast.classList.remove('ativo'), 3000);
    }

    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.textContent = '☀️';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '🌙';
        }
    }

    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        if (current === 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            themeToggle.textContent = '☀️';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeToggle.textContent = '🌙';
        }
    });

    function initMenu() {
        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            });
        }
        if (closeMenu) closeMenu.addEventListener('click', fecharMenu);
        if (overlay) overlay.addEventListener('click', fecharMenu);
        if (document.getElementById('menuHome')) {
            document.getElementById('menuHome').addEventListener('click', () => {
                fecharMenu();
                window.location.href = '/';
            });
        }
        if (document.getElementById('menuApresentacao')) {
            document.getElementById('menuApresentacao').addEventListener('click', () => {
                fecharMenu();
                mostrarToast('📖 ZonaXP - Distribuição de jogos PSP e Mobile');
            });
        }
        if (document.getElementById('menuSuporte')) {
            document.getElementById('menuSuporte').addEventListener('click', () => {
                fecharMenu();
                window.location.href = 'mensagens.html';
            });
        }
    }

    function fecharMenu() {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    }

    function fazerLogout() {
        localStorage.removeItem('sessaoAtiva');
        localStorage.removeItem('utilizador');
        utilizadorAtual = null;
        window.location.href = 'index.html';
    }

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && searchInput.value.trim()) {
            window.location.href = '/?busca=' + encodeURIComponent(searchInput.value);
        }
    });

    async function carregarJogo() {
        const urlParams = new URLSearchParams(window.location.search);
        const jogoId = urlParams.get('jogo');
        const slug = urlParams.get('slug');

        if (!jogoId && !slug) {
            mostrarErro('Nenhum jogo especificado');
            return;
        }

        try {
            let jogo = null;
            if (slug) {
                const res = await fetch(API_URL + '/api/jogos/slug/' + slug);
                if (res.ok) jogo = await res.json();
            } else {
                const res = await fetch(API_URL + '/api/jogos/' + jogoId);
                if (res.ok) jogo = await res.json();
            }

            if (!jogo) {
                mostrarErro('Jogo não encontrado');
                return;
            }

            jogoAtual = jogo;

            // REGISTAR VISUALIZAÇÃO
            fetch(API_URL + '/api/jogos/' + jogo.id + '/visualizar', {
                method: 'POST'
            }).catch(() => {});

            const resTodos = await fetch(API_URL + '/api/jogos');
            const dataTodos = await resTodos.json();
            todosJogos = dataTodos.jogos || [];

            renderizarPagina();
        } catch (error) {
            console.error('Erro:', error);
            mostrarErro('Erro ao carregar jogo');
        }
    }

    function getImagemUrl(jogo) {
        if (!jogo.imagem) return 'https://via.placeholder.com/800x300?text=ZonaXP';
        if (jogo.imagem.startsWith('http')) return jogo.imagem;
        return API_URL + '/imagens/' + jogo.imagem + '.jpg';
    }

    function renderizarPagina() {
        const imagemUrl = getImagemUrl(jogoAtual);
        const badgeClass = jogoAtual.pago ? 'badge-paid' : 'badge-free';
        const badgeText = jogoAtual.pago ? '💰 ' + jogoAtual.preco : '🎁 Grátis';

        let isLiked = false;
        let isDisliked = false;
        if (utilizadorAtual && utilizadorAtual.likes) {
            if (utilizadorAtual.likes[jogoAtual.id] !== undefined) {
                isLiked = utilizadorAtual.likes[jogoAtual.id] === true;
                isDisliked = utilizadorAtual.likes[jogoAtual.id] === false;
            }
        }

        const links = [];
        if (jogoAtual.download) links.push({ nome: '⬇️ Download', link: jogoAtual.download });
        if (jogoAtual.apk_link) links.push({ nome: '📱 APK', link: jogoAtual.apk_link });
        if (jogoAtual.obb_link) links.push({ nome: '💾 OBB', link: jogoAtual.obb_link });
        if (jogoAtual.data_link) links.push({ nome: '📁 DATA', link: jogoAtual.data_link });
        if (jogoAtual.texture_link) links.push({ nome: '🎨 Texturas', link: jogoAtual.texture_link });
        if (jogoAtual.save_link) links.push({ nome: '💾 Savedata', link: jogoAtual.save_link });
        if (jogoAtual.iso_link) links.push({ nome: '🎮 ISO/ROM', link: jogoAtual.iso_link });

        let botoesDownload = '';

        if (jogoAtual.pago) {
            const mensagemWhatsApp = 'Quero%20comprar%20' + encodeURIComponent(jogoAtual.nome);
            botoesDownload = `
                <div class="download-buttons">
                    <button class="btn-download btn-paid" onclick="window.location.href='checkout.html?jogo=${jogoAtual.id}'">
                        💳 Pagar Automático
                    </button>
                    <button class="btn-download btn-blue" onclick="window.open('https://wa.me/258858523520?text=${mensagemWhatsApp}', '_blank')">
                        📱 Pagar Manual (WhatsApp)
                    </button>
                </div>
            `;
        } else if (links.length > 0) {
            botoesDownload = '<div class="download-buttons">';
            links.forEach(link => {
                botoesDownload += `<button class="btn-download btn-blue" onclick="fazerDownload('${link.link}', '${jogoAtual.nome}')">${link.nome}</button>`;
            });
            botoesDownload += '</div>';
        } else {
            botoesDownload = '<p style="text-align:center;color:red;">Nenhum link disponível</p>';
        }

        const relacionados = todosJogos.filter(j => j.id !== jogoAtual.id && j.categoria === jogoAtual.categoria && !j.pago).slice(0, 10);

        let htmlRelacionados = '';
        if (relacionados.length > 0) {
            htmlRelacionados = '<div class="recomendados"><h4>🎮 Você também pode gostar</h4><div class="recomendados-scroll">';
            relacionados.forEach(jogo => {
                const img = getImagemUrl(jogo);
                const link = jogo.slug ? 'download.html?slug=' + jogo.slug : 'download.html?jogo=' + jogo.id;
                htmlRelacionados += `
                    <div class="recom-card" onclick="window.location.href='${link}'">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/160x120?text=${encodeURIComponent(jogo.nome)}'">
                        <div class="info"><h5>${jogo.nome}</h5><p>${jogo.categoria}</p></div>
                        <div class="arrow">→</div>
                    </div>
                `;
            });
            htmlRelacionados += '</div></div>';
        }

        content.innerHTML = `
            <div class="imagem-area">
                <img src="${imagemUrl}" onerror="this.src='https://via.placeholder.com/800x300?text=${encodeURIComponent(jogoAtual.nome)}'">
                <div class="price-badge ${badgeClass}">${badgeText}</div>
            </div>

            <div class="info">
                <h1>${jogoAtual.nome}</h1>
                <div>
                    <span class="categoria">${jogoAtual.categoria}</span>
                    <span class="plataforma">${jogoAtual.plataforma === 'APK Android' ? '📱' : '🎮'} ${jogoAtual.plataforma}</span>
                </div>
                <div class="tamanho">📦 ${jogoAtual.tamanho || 'Tamanho não informado'}</div>
            </div>

            <div class="rating-share">
                <div class="rating">
                    <button class="like-btn" onclick="votar('like', event)">
                        <span class="icon ${isLiked ? 'liked' : ''}">♥</span>
                        <span class="count">${jogoAtual.likes || 0}</span>
                    </button>
                    <button class="dislike-btn" onclick="votar('dislike', event)">
                        <span class="icon ${isDisliked ? 'disliked' : ''}">👎</span>
                        <span class="count">${jogoAtual.dislikes || 0}</span>
                    </button>
                    <div class="views">👁️ ${jogoAtual.visualizacoes || 0}</div>
                </div>
                <div class="share-social">
                    <button class="share-btn" onclick="partilharJogo()" title="Partilhar"><i class="fas fa-share-alt"></i></button>
                    <a href="https://whatsapp.com/channel/0029Vb7YAqi3bbV9tuuiyC1p" target="_blank" class="share-icon whatsapp" title="Canal WhatsApp"><i class="fab fa-whatsapp"></i></a>
                    <a href="https://www.tiktok.com/@zonaxp" target="_blank" class="share-icon tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>

            <div class="downloads-section">
                <div class="download-title">📥 DOWNLOAD</div>
                ${jogoAtual.partilha_ativa && !jogoAtual.pago ? '<div class="aviso-partilha">⚠️ Este jogo requer partilha antes de baixar</div>' : ''}
                ${botoesDownload}
            </div>

            ${jogoAtual.senha ? `<div class="senha-area"><h4>🔐 Senha</h4><div class="senha">${jogoAtual.senha}</div></div>` : ''}

            ${jogoAtual.descricao_longa ? `<div class="descricao-area"><h4>📖 Sobre o jogo</h4><div class="descricao-longa">${jogoAtual.descricao_longa}</div></div>` : ''}

            ${htmlRelacionados}
        `;
    }

    async function votar(tipo, event) {
        if (event) event.stopPropagation();
        if (!utilizadorAtual) {
            mostrarToast('🔐 Cria conta para dar like');
            modalConta.classList.add('ativo');
            return;
        }

        try {
            const res = await fetch(API_URL + '/api/utilizadores/' + utilizadorAtual.id + '/like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jogoId: jogoAtual.id, tipo })
            });
            const result = await res.json();

            if (res.ok) {
                utilizadorAtual.likes = result.likes;
                localStorage.setItem('utilizador', JSON.stringify(utilizadorAtual));

                const votoAtual = result.likes[jogoAtual.id];
                if (votoAtual === true) {
                    jogoAtual.likes = (jogoAtual.likes || 0) + 1;
                    if (jogoAtual.dislikes > 0) jogoAtual.dislikes--;
                } else if (votoAtual === false) {
                    jogoAtual.dislikes = (jogoAtual.dislikes || 0) + 1;
                    if (jogoAtual.likes > 0) jogoAtual.likes--;
                } else {
                    if (jogoAtual.likes > 0) jogoAtual.likes--;
                    if (jogoAtual.dislikes > 0) jogoAtual.dislikes--;
                }

                await fetch(API_URL + '/api/avaliacao/' + jogoAtual.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ likes: jogoAtual.likes, dislikes: jogoAtual.dislikes })
                });

                renderizarPagina();
            }
        } catch (e) {
            console.error('Erro ao votar:', e);
            mostrarToast('❌ Erro ao votar');
        }
    }

    async function fazerDownload(link, nomeJogo) {
        if (!utilizadorAtual) {
            mostrarToast('🔐 Cria conta para baixar');
            modalConta.classList.add('ativo');
            return;
        }

        if (jogoAtual.partilha_ativa && !jogoAtual.pago) {
            const linkJogo = jogoAtual.slug ? 'compartilhar.html?slug=' + jogoAtual.slug : 'compartilhar.html?jogo=' + jogoAtual.id;
            window.location.href = linkJogo;
            return;
        }

        try {
            await fetch(API_URL + '/api/utilizadores/' + utilizadorAtual.id + '/historico', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jogoId: jogoAtual.id })
            });
        } catch (e) {
            console.error('Erro ao guardar histórico:', e);
        }

        window.open(link, '_blank');
        mostrarToast('✅ Download iniciado: ' + nomeJogo);
    }

    function partilharJogo() {
        if (!jogoAtual) return;

        const shareUrl = jogoAtual.slug
            ? window.location.origin + '/download.html?slug=' + jogoAtual.slug
            : window.location.origin + '/download.html?jogo=' + jogoAtual.id;

        const shareText = jogoAtual.nome +
            '\n📂 Categoria: ' + jogoAtual.categoria +
            '\n🎯 Plataforma: ' + jogoAtual.plataforma +
            '\n📦 Tamanho: ' + (jogoAtual.tamanho || 'Não informado') +
            '\n\n✅ Grátis para download!' +
            '\n\n👇 Clique no link abaixo: ' + shareUrl;

        if (navigator.share) {
            navigator.share({ title: 'ZonaXP - ' + jogoAtual.nome, text: shareText, url: shareUrl });
        } else {
            navigator.clipboard.writeText(shareText).then(() => {
                mostrarToast('📋 Link copiado!');
            }).catch(() => {
                prompt('Copie o link:', shareUrl);
            });
        }
    }

    function fecharModalConta() {
        modalConta.classList.remove('ativo');
    }

    function mostrarErro(mensagem) {
        content.innerHTML = `
            <div class="error">
                <h3>⚠️ Erro</h3>
                <p>${mensagem}</p>
                <button class="btn-download btn-blue" onclick="window.location.href='/'">Voltar para Home</button>
            </div>
        `;
    }

    utilizadorAtual = verificarSessao();
    
    // Lógica do botão voltar no header
    if (utilizadorAtual) {
        btnVoltarHeader.style.display = 'inline-flex';
    }

    initTheme();
    initMenu();
    carregarJogo();

    window.votar = votar;
    window.fazerDownload = fazerDownload;
    window.partilharJogo = partilharJogo;
    window.fecharModalConta = fecharModalConta;
    window.fazerLogout = fazerLogout;
</script>

</body>
</html>
