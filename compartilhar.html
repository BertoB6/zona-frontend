<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZonaXP - Partilhe e Baixe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
        }

        .card {
            background: #111;
            border-radius: 24px;
            padding: 25px 20px;
            border: 1px solid rgba(255, 0, 79, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff004f, #8000ff, #00ff9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .jogo-info {
            margin-bottom: 20px;
        }

        .jogo-info img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 16px;
            border: 2px solid #ff004f;
            background: #0a0a0a;
            margin-bottom: 12px;
        }

        .jogo-info h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .jogo-info p {
            color: #888;
            font-size: 0.85rem;
        }

        .progresso-area {
            margin: 20px 0;
        }

        .progresso-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .progresso-bar {
            background: #222;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progresso-fill {
            background: linear-gradient(90deg, #ff004f, #8000ff);
            width: 0%;
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        .progresso-texto {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff9c;
        }

        .btn-partilhar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #25D366, #128C7E);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-partilhar:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .btn-partilhar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-baixar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00ff9c, #00cc7a);
            border: none;
            border-radius: 50px;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            display: none;
        }

        .btn-baixar:hover {
            transform: scale(1.02);
        }

        .info-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
        }

        .info-text strong {
            color: #ffaa00;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal-content {
            background: #111;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 1px solid #ff004f;
        }

        .modal-content h3 {
            color: #00ff9c;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .modal-content p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 10px 0;
        }

        .modal-content button {
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
        }

        .btn-sim {
            background: #25D366;
            color: white;
        }

        .btn-nao {
            background: #333;
            color: white;
        }

        /* LOADING / ERRO */
        .loading, .erro {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .erro h3 {
            color: #ff004f;
            margin-bottom: 10px;
        }

        .btn-voltar {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff004f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10000;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.ativo {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="app">
        <div class="loading">🔄 Carregando...</div>
    </div>
</div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div class="modal-overlay" id="modalConfirmar">
    <div class="modal-content">
        <h3>✅ Já partilhaste?</h3>
        <p>Confirma se já partilhaste o link num grupo ou contacto.</p>
        <button class="btn-sim" onclick="confirmarPartilha()">✅ SIM, JÁ PARTILHEI</button>
        <button class="btn-nao" onclick="fecharModal()">❌ AINDA NÃO</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_URL = 'https://zona-backend-v3h1.onrender.com';

    let jogoAtual = null;
    let utilizadorAtual = null;
    let partilhasFeitas = 0;
    let totalPartilhas = 0;
    let aguardandoRetorno = false;

    // ==================== VERIFICAR SESSÃO ====================
    function verificarSessao() {
        const sessao = localStorage.getItem('sessaoAtiva');
        const utilizadorStr = localStorage.getItem('utilizador');

        if (sessao !== 'true' || !utilizadorStr) {
            localStorage.setItem('redirectAfterLogin', window.location.href);
            window.location.href = 'login.html';
            return null;
        }

        try {
            return JSON.parse(utilizadorStr);
        } catch (e) {
            window.location.href = 'login.html';
            return null;
        }
    }

    // ==================== TOAST ====================
    function mostrarToast(mensagem) {
        const toast = document.getElementById('toast');
        toast.textContent = mensagem;
        toast.classList.add('ativo');
        setTimeout(() => toast.classList.remove('ativo'), 3000);
    }

    // ==================== CARREGAR JOGO ====================
    async function carregarJogo() {
        const urlParams = new URLSearchParams(window.location.search);
        const jogoId = urlParams.get('jogo');
        const slug = urlParams.get('slug');

        if (!jogoId && !slug) {
            mostrarErro('Nenhum jogo especificado');
            return;
        }

        try {
            let jogo = null;

            if (slug) {
                const res = await fetch(API_URL + '/api/jogos/slug/' + slug);
                if (res.ok) jogo = await res.json();
            } else {
                const res = await fetch(API_URL + '/api/jogos/' + jogoId);
                if (res.ok) jogo = await res.json();
            }

            if (!jogo) {
                mostrarErro('Jogo não encontrado');
                return;
            }

            jogoAtual = jogo;
            totalPartilhas = jogo.partilhas_necessarias || 0;

            // Verificar progresso guardado para este jogo
            const progressoKey = 'partilhas_' + jogo.id;
            const progressoGuardado = localStorage.getItem(progressoKey);
            if (progressoGuardado) {
                partilhasFeitas = parseInt(progressoGuardado) || 0;
            }

            renderizarPagina();
        } catch (error) {
            console.error('Erro:', error);
            mostrarErro('Erro ao carregar jogo');
        }
    }

    // ==================== RENDERIZAR ====================
    function renderizarPagina() {
        const imgUrl = jogoAtual.imagem && jogoAtual.imagem.startsWith('http')
            ? jogoAtual.imagem
            : (API_URL + '/imagens/' + jogoAtual.imagem + '.jpg');

        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="logo">🎮 ZonaXP</div>

            <div class="jogo-info">
                <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/400x200?text=${encodeURIComponent(jogoAtual.nome)}'">
                <h2>${jogoAtual.nome}</h2>
                <p>${jogoAtual.categoria} • ${jogoAtual.plataforma}</p>
            </div>

            <div class="progresso-area">
                <div class="progresso-label">📢 PROGRESSO DA PARTILHA</div>
                <div class="progresso-bar">
                    <div class="progresso-fill" id="progressoFill"></div>
                </div>
                <div class="progresso-texto" id="progressoTexto">0 / ${totalPartilhas} partilhas</div>
            </div>

            <button class="btn-partilhar" id="btnPartilhar" onclick="abrirWhatsApp()">
                📤 PARTILHAR NO WHATSAPP
            </button>

            <button class="btn-baixar" id="btnBaixar" onclick="irParaDownload()">
                🎁 LIBERAR DOWNLOAD
            </button>

            <div class="info-text">
                ⚠️ Partilhe o link em <strong>${totalPartilhas} grupos ou contactos</strong> para desbloquear o jogo.
            </div>
        `;

        atualizarProgresso();
    }

    // ==================== ATUALIZAR PROGRESSO ====================
    function atualizarProgresso() {
        const fill = document.getElementById('progressoFill');
        const texto = document.getElementById('progressoTexto');
        const btnPartilhar = document.getElementById('btnPartilhar');
        const btnBaixar = document.getElementById('btnBaixar');

        if (!fill || !texto) return;

        const pct = totalPartilhas > 0 ? Math.min((partilhasFeitas / totalPartilhas) * 100, 100) : 100;
        fill.style.width = pct + '%';
        texto.textContent = partilhasFeitas + ' / ' + totalPartilhas + ' partilhas';

        // Guardar progresso
        localStorage.setItem('partilhas_' + jogoAtual.id, partilhasFeitas);

        if (partilhasFeitas >= totalPartilhas) {
            btnPartilhar.style.display = 'none';
            btnBaixar.style.display = 'block';
        } else {
            btnPartilhar.style.display = 'flex';
            btnBaixar.style.display = 'none';
        }
    }

    // ==================== ABRIR WHATSAPP ====================
    function abrirWhatsApp() {
        if (partilhasFeitas >= totalPartilhas) {
            mostrarToast('🎉 Já completaste todas as partilhas!');
            return;
        }

        // Link do jogo para partilhar
        const linkJogo = window.location.origin + '/download.html?jogo=' + (jogoAtual.slug || jogoAtual.id);

        const mensagem = `🎮 Veja o ${jogoAtual.nome} 🎮

Obrigado ZonaXP por ter deixado disponível para jogar!

👇 Link para baixar:
${linkJogo}`;

        const urlWhatsApp = 'https://wa.me/?text=' + encodeURIComponent(mensagem);
        window.open(urlWhatsApp, '_blank');

        aguardandoRetorno = true;

        // Mostrar modal após voltar
        setTimeout(() => {
            if (aguardandoRetorno) {
                document.getElementById('modalConfirmar').classList.add('ativo');
            }
        }, 1500);
    }

    // ==================== CONFIRMAR PARTILHA ====================
    function confirmarPartilha() {
        partilhasFeitas++;
        atualizarProgresso();
        fecharModal();
        aguardandoRetorno = false;

        if (partilhasFeitas < totalPartilhas) {
            const faltam = totalPartilhas - partilhasFeitas;
            mostrarToast('✅ Partilha confirmada! Faltam ' + faltam);
        } else {
            mostrarToast('🎉 Parabéns! Jogo liberado!');
        }
    }

    function fecharModal() {
        document.getElementById('modalConfirmar').classList.remove('ativo');
        aguardandoRetorno = false;
    }

    // ==================== IR PARA DOWNLOAD ====================
    async function irParaDownload() {
        // Registar no histórico do utilizador
        if (utilizadorAtual && jogoAtual) {
            try {
                await fetch(API_URL + '/api/utilizadores/' + utilizadorAtual.id + '/historico', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jogoId: jogoAtual.id })
                });
            } catch (e) {
                console.error('Erro ao guardar histórico:', e);
            }
        }

        // Limpar progresso de partilhas
        localStorage.removeItem('partilhas_' + jogoAtual.id);

        // Ir para download
        window.location.href = 'download.html?jogo=' + (jogoAtual.slug || jogoAtual.id);
    }

    // ==================== MOSTRAR ERRO ====================
    function mostrarErro(mensagem) {
        document.getElementById('app').innerHTML = `
            <div class="erro">
                <h3>⚠️ Erro</h3>
                <p>${mensagem}</p>
                <button class="btn-voltar" onclick="window.location.href='/'">← Voltar ao site</button>
            </div>
        `;
    }

    // ==================== INICIALIZAR ====================
    utilizadorAtual = verificarSessao();
    if (utilizadorAtual) {
        carregarJogo();
    }

    // Expor funções globais
    window.abrirWhatsApp = abrirWhatsApp;
    window.confirmarPartilha = confirmarPartilha;
    window.fecharModal = fecharModal;
    window.irParaDownload = irParaDownload;
</script>

</body>
</html>
