<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZonaXP - Partilhe e Baixe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .card {
            background: #111;
            border-radius: 24px;
            padding: 25px 20px;
            border: 1px solid rgba(255, 0, 79, 0.25);
            text-align: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff004f, #8000ff, #00ff9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .jogo-info {
            margin-bottom: 20px;
        }

        .jogo-info img {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 16px;
            border: 2px solid #ff004f;
            background: #0a0a0a;
        }

        .jogo-info h2 {
            font-size: 1.3rem;
            margin-top: 12px;
        }

        .jogo-info p {
            color: #888;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .progresso-area {
            margin: 20px 0;
        }

        .progresso-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
        }

        .progresso-bar {
            background: #222;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
        }

        .progresso-fill {
            background: linear-gradient(90deg, #ff004f, #8000ff);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
            border-radius: 20px;
        }

        .progresso-texto {
            font-size: 0.9rem;
            font-weight: bold;
            color: #00ff9c;
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-partilhar {
            background: linear-gradient(90deg, #25D366, #128C7E);
            color: white;
        }

        .btn-partilhar:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .btn-partilhar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-baixar {
            background: linear-gradient(90deg, #00ff9c, #00cc7a);
            color: #0a0a0a;
            display: none;
        }

        .btn-baixar:hover {
            transform: scale(1.02);
        }

        .info-text {
            font-size: 0.65rem;
            color: #555;
            margin-top: 15px;
            line-height: 1.5;
        }

        .info-text strong {
            color: #ffaa00;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            max-width: 280px;
            border: 1px solid #ff004f;
        }

        .modal-content h3 {
            color: #00ff9c;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 10px 0;
        }

        .modal-content button {
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-sim {
            background: #25D366;
            color: white;
        }

        .btn-nao {
            background: #333;
            color: white;
        }

        @media (max-width: 500px) {
            .card { padding: 20px 16px; }
            .jogo-info img { max-height: 180px; }
            .logo { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">🎮 ZonaXP</div>

        <div class="jogo-info">
            <img id="jogoImagem" src="https://res.cloudinary.com/duofl5h4w/image/upload/v1779986462/ae64ddd32a9d35b93ea9efe2967f70ab_ugvcjk.png" alt="Jogo">
            <h2 id="jogoNome">Mission Berlin</h2>
            <p id="jogoDesc">Partilhe e baixe grátis</p>
        </div>

        <div class="progresso-area">
            <div class="progresso-label">📢 PROGRESSO</div>
            <div class="progresso-bar">
                <div class="progresso-fill" id="progressoFill"></div>
            </div>
            <div class="progresso-texto" id="progressoTexto">0 / 5 partilhas</div>
        </div>

        <button class="btn btn-partilhar" id="btnPartilhar">📤 PARTILHAR NO WHATSAPP</button>
        <button class="btn btn-baixar" id="btnBaixar">🎁 LIBERAR DOWNLOAD</button>

        <div class="info-text">
            ⚠️ Partilhe o link em <strong>5 grupos ou contactos</strong> para desbloquear o jogo.
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3>✅ Já partilhou?</h3>
        <p>Confirme se já partilhou o link.</p>
        <button class="btn-sim" id="btnSim">✅ SIM, JÁ PARTILHEI</button>
        <button class="btn-nao" id="btnNao">❌ AINDA NÃO</button>
    </div>
</div>

<script>
    // ==================== CONFIGURAÇÃO ====================
    const JOGO = {
        nome: "Sega Rally Revo",
        descricao: "Partilhe e baixe grátis",
        imagemUrl: "https://res.cloudinary.com/duofl5h4w/image/upload/v1783956410/MV5BMGQ0ZDBjYjItZDY4Mi00ZGExLWJkOTMtM2RlYTg3ZmRiMTg5XkEyXkFqcGc._V1__ux9czy.jpg",
        linkDownload: "https://www.mediafire.com/download/dtjatrkozi304an"
    };

    const LINK_DO_JOGO = "https://zonaxp.vercel.app/download.html?jogo=67";
    const TOTAL_PARTILHAS = 5;

    const MENSAGEM_FIXA = `🎮 *Veja o ${JOGO.nome}* 🎮

Obrigado ZonaXP por ter deixado disponível para jogar!

👇 Link para baixar:
${LINK_DO_JOGO}`;

    // ==================== SISTEMA ====================
    let partilhasFeitas = parseInt(localStorage.getItem('partilhasProgresso')) || 0;
    let aguardandoRetorno = false;

    // Elementos
    const btnPartilhar = document.getElementById('btnPartilhar');
    const btnBaixar = document.getElementById('btnBaixar');
    const progressoFill = document.getElementById('progressoFill');
    const progressoTexto = document.getElementById('progressoTexto');
    const modal = document.getElementById('modal');
    const btnSim = document.getElementById('btnSim');
    const btnNao = document.getElementById('btnNao');

    function atualizarProgresso() {
        const pct = Math.min((partilhasFeitas / TOTAL_PARTILHAS) * 100, 100);
        progressoFill.style.width = pct + '%';
        progressoTexto.textContent = `${partilhasFeitas} / ${TOTAL_PARTILHAS} partilhas`;
        localStorage.setItem('partilhasProgresso', partilhasFeitas);

        if (partilhasFeitas >= TOTAL_PARTILHAS) {
            btnPartilhar.style.display = 'none';
            btnBaixar.style.display = 'flex';
        }
    }

    function abrirWhatsApp() {
        window.open(`https://wa.me/?text=${encodeURIComponent(MENSAGEM_FIXA)}`, '_blank');
        aguardandoRetorno = true;

        setTimeout(() => {
            if (aguardandoRetorno) {
                modal.style.display = 'flex';
            }
        }, 1500);
    }

    function confirmarPartilha() {
        partilhasFeitas++;
        atualizarProgresso();
        modal.style.display = 'none';
        aguardandoRetorno = false;

        if (partilhasFeitas < TOTAL_PARTILHAS) {
            alert(`✅ Partilha confirmada! Faltam ${TOTAL_PARTILHAS - partilhasFeitas}.`);
        } else {
            alert('🎉 Parabéns! Jogo liberado!');
        }
    }

    function baixarJogo() {
        window.open(JOGO.linkDownload, '_blank');
    }

    // Eventos
    btnPartilhar.addEventListener('click', abrirWhatsApp);
    btnBaixar.addEventListener('click', baixarJogo);
    btnSim.addEventListener('click', confirmarPartilha);
    btnNao.addEventListener('click', () => {
        modal.style.display = 'none';
        aguardandoRetorno = false;
    });

    // Fechar modal ao clicar fora
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            aguardandoRetorno = false;
        }
    });

    // Inicializar
    atualizarInfoJogo();
    atualizarProgresso();

    function atualizarInfoJogo() {
        document.getElementById('jogoNome').textContent = JOGO.nome;
        document.getElementById('jogoDesc').textContent = JOGO.descricao;
        document.getElementById('jogoImagem').src = JOGO.imagemUrl;
    }
</script>
</body>
</html>
