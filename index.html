<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZonaXP - Jogos PSP e Mobile</title>
    <meta name="description" content="Distribuição de jogos para PSP, Android e iOS. Downloads gratuitos e premium.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.5;
        }

        /* Container principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff004f, #8000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Menu */
        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ff004f;
        }

        .menu-icon {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }

        /* Sidebar mobile */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: #111;
            z-index: 1000;
            transition: 0.3s;
            padding: 60px 20px 20px;
            border-left: 1px solid #ff004f;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            padding: 12px 0;
            color: #ccc;
            text-decoration: none;
            border-bottom: 1px solid #222;
        }

        .sidebar a:hover {
            color: #ff004f;
        }

        .close-sidebar {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #ff004f;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Barra de pesquisa */
        .search-bar {
            margin: 20px 0;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #ff004f;
        }

        /* Filtros */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .filter-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 30px;
            color: #ccc;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ff004f, #8000ff);
            border-color: transparent;
            color: white;
        }

        /* Grid de jogos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        /* Card de jogo */
        .game-card {
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #222;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #ff004f;
            box-shadow: 0 8px 20px rgba(255, 0, 79, 0.15);
        }

        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .game-info {
            padding: 14px;
        }

        .game-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-category {
            font-size: 0.7rem;
            color: #ff004f;
            background: rgba(255, 0, 79, 0.1);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            font-size: 0.7rem;
            color: #888;
        }

        .btn-download {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #ff004f, #8000ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        /* Destaque */
        .destaque-section {
            margin: 30px 0;
        }

        .destaque-section h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffaa00;
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            display: none;
        }

        .popup-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            border: 1px solid #ff004f;
        }

        .popup-content h3 {
            color: #ff004f;
            margin-bottom: 15px;
        }

        .popup-content .price {
            font-size: 1.3rem;
            color: #00ff9c;
            margin: 15px 0;
            font-weight: bold;
        }

        .popup-content button {
            margin-top: 10px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff004f, #8000ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .popup-content .btn-fechar {
            background: #333;
        }

        /* Footer */
        footer {
            background: #111;
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid #222;
            margin-top: 40px;
        }

        footer a {
            color: #888;
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.8rem;
        }

        footer a:hover {
            color: #ff004f;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .menu-icon {
                display: block;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            .container {
                padding: 0 15px;
            }
        }

        @media (max-width: 550px) {
            .games-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .game-info {
                padding: 10px;
            }

            .game-card img {
                height: 140px;
            }

            .game-info h3 {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">ZonaXP</div>
            <div class="nav-links">
                <a href="#" id="navHome">Home</a>
                <a href="#" id="navSuporte">Suporte</a>
                <a href="compartilhar.html">🎁 Ganhar</a>
            </div>
            <button class="menu-icon" id="menuBtn">☰</button>
        </div>
    </header>

    <!-- Sidebar mobile -->
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" id="closeSidebar">✕</div>
        <a href="#" id="sidebarHome">🏠 Home</a>
        <a href="#" id="sidebarSuporte">🛡️ Suporte</a>
        <a href="compartilhar.html">🎁 Ganhar Jogos</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- Barra de pesquisa -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar jogo...">
        </div>

        <!-- Filtros -->
        <div class="filters" id="filtersContainer">
            <button class="filter-btn active" data-plataforma="todos">Todos</button>
            <button class="filter-btn" data-plataforma="PSP">PSP</button>
            <button class="filter-btn" data-plataforma="PS2">PS2</button>
            <button class="filter-btn" data-plataforma="PC">PC</button>
            <button class="filter-btn" data-plataforma="APK Android">APK</button>
        </div>

        <!-- Destaques -->
        <div class="destaque-section" id="destaqueSection" style="display: none;">
            <h2>⭐ Destaques</h2>
            <div class="games-grid" id="destaqueGrid"></div>
        </div>

        <!-- Grid principal -->
        <div id="gamesContainer">
            <div class="loading" id="loading">🎮 Carregando jogos...</div>
            <div class="games-grid" id="games"></div>
        </div>
    </div>

    <footer>
        <div>
            <a href="#" id="footerHome">Home</a>
            <a href="#" id="footerSuporte">Suporte</a>
            <a href="compartilhar.html">Ganhar Jogos</a>
            <a href="https://whatsapp.com/channel/0029Vb7YAqi3bbV9tuuiyC1p" target="_blank">Canal WhatsApp</a>
        </div>
        <div style="margin-top: 15px; font-size: 0.7rem; color: #555;">
            © 2026 ZonaXP - Todos os direitos reservados
        </div>
    </footer>

    <!-- Popup -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <h3>💰 Jogo Premium</h3>
            <div class="price" id="priceText"></div>
            <button id="btnDownloadPremium">⬇️ Baixar Agora</button>
            <button class="btn-fechar" onclick="fecharPopup()">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
